name: Autonomous Antigravity Agent

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: autonomous-agent-pipeline
  cancel-in-progress: false

jobs:
  autonomous-fix:
    name: Execute Antigravity Agent
    # Only run direct auto-deploy if explicitly labeled with 'trigger-agent-direct'
    if: contains(github.event.issue.labels.*.name, 'trigger-agent-direct')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Post In-Progress Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Google Antigravity Agent Activated**\n\nThe autonomous feedback pipeline has picked up this request. Inspecting codebase, applying changes, and running verification suite...`
            });

      - name: Execute Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          npx tsx scripts/run-autonomous-agent.ts

      - name: Validate TypeScript & Build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Start Server & Run Verification Test Suite
        run: |
          npm start &
          echo "Waiting for server to spin up on port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/lunch > /dev/null; then
              echo "Server ready!"
              break
            fi
            sleep 1
          done
          npm test

      - name: Commit & Push Changes to Main
        id: commit_and_push
        run: |
          git config --global user.name "Google Antigravity Agent"
          git config --global user.email "antigravity-agent@google.com"

          # Check if changes exist
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git add -A
            git commit -m "Fixes #${{ github.event.issue.number }}: [Antigravity Agent] ${{ github.event.issue.title }}"
            git push origin main
            echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Close Issue with Success Summary
        if: steps.commit_and_push.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.commit_and_push.outputs.commit_sha }}';
            const shortSha = sha.slice(0, 7);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Fix Verified & Deployed!**\n\nThe Google Antigravity Agent has successfully:\n- Implemented code modifications\n- Verified TypeScript syntax & tests\n- Pushed commit [\`${shortSha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}) to \`main\`\n\nFirebase App Hosting is now automatically deploying the updated revision to production. Deployment timestamp updated in the Data Admin Panel!`
            });
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Handle Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **Agent Run Encountered an Issue**\n\nThe autonomous agent or test suite encountered an error during execution. Changes were not pushed to \`main\`.\n\nPlease check the [GitHub Actions Run Log](https://github.com/${context.repo.owner}/${context.repo.repo}/actions) for full diagnostic details.`
            });
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['agent-failed']
              });
            } catch (e) {
              console.warn('Could not attach agent-failed label:', e);
            }

