name: "Workflow: Website Feedback ➔ Gemini Chat ➔ Functional Pull Request"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      auto_create_pr:
        description: 'Automatically open Pull Request proposal on GitHub'
        required: true
        type: boolean
        default: true
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: beagle-triage-pipeline
  cancel-in-progress: false

jobs:
  triage:
    # Run if triggered manually, OR if an issue with 'feedback-inbox' is opened, OR if comment starts with /triage
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'feedback-inbox')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/triage'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git Author
        run: |
          git config user.name "Beagle Triage Agent"
          git config user.email "beagle-agent@swentonelli.local"

      - name: Execute Beagle Batch Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npx tsx scripts/triage-feedback.ts --create-pr

      - name: Post Triage Status Comment (if triggered from issue comment)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🐶 **Talk to the Beagle**: Batch feedback triage workflow completed! Check the Pull Requests tab for the consolidated proposal."
            })
