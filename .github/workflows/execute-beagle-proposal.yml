name: "Workflow: Take Functional Pull Request ➔ Gemini Coding ➔ Add Implementation to Pull Request"

on:
  pull_request:
    types: [edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number to Execute'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  execute-proposal:
    # Run if triggered manually OR if PR checkbox is checked OR if comment starts with /execute or /implement
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'edited' &&
       contains(github.event.pull_request.body, '- [x] **Ready to execute**') &&
       !contains(github.event.changes.body.from, '- [x] **Ready to execute**')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/execute') || startsWith(github.event.comment.body, '/implement')))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Pull Request Information
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pr_number;
            } else if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else {
              prNumber = context.issue.number;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('pr_number', prNumber);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('title', pr.title);

      - name: Post In-Progress Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.pr_info.outputs.pr_number }}', 10),
              body: "🤖 **Gemini Coding Agent**: Implementation started! Analyzing the Functional Pull Request, writing code, and running tests..."
            });

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git Author
        run: |
          git config user.name "Gemini Coding Agent"
          git config user.email "gemini-coder@swentonelli.local"

      - name: Execute Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
        run: |
          npx tsx .harness/bin/run-coder.ts --pr ${{ steps.pr_info.outputs.pr_number }}

      - name: Commit and Push Implemented Changes
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "feat: add implementation to pull request (PR #${{ steps.pr_info.outputs.pr_number }})"
            git pull --rebase origin ${{ steps.pr_info.outputs.branch }} || true
            git push origin ${{ steps.pr_info.outputs.branch }}
          else
            echo "No changes detected."
          fi

      - name: Post Completion Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.pr_info.outputs.pr_number }}', 10),
              body: "✅ **Gemini Coding Agent**: Implementation complete and verified! Code changes have been committed to this pull request."
            });

      - name: Risk-Tiered Auto-Merge on Green
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.pr_info.outputs.pr_number }}', 10);
            
            // Check PR labels and title for risk tier
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const isLowRisk = pr.data.labels.some(l => l.name === 'risk:low') ||
                              /\[Website Feedback\]|copy|style|color|subtitle|text|dialog/i.test(pr.data.title);

            if (isLowRisk) {
              console.log(`🚀 [Auto-Merge] PR #${prNumber} verified and classified as low-risk. Merging automatically...`);
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: `feat(autonomous): auto-merge verified proposal #${prNumber}`,
                  commit_message: `Auto-merged by Autonomous Engineering Harness after all verification gates passed cleanly.`
                });
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: "🚀 **Autonomous 0-Touch Delivery**: Verified low-risk proposal passed all gates and has been **automatically merged** to `main`! Live deployment is in progress."
                });
              } catch (e) {
                console.warn("Auto-merge encountered an issue, leaving open for manual 1-tap review:", e.message);
              }
            } else {
              console.log(`🛡️ [Risk Gate] PR #${prNumber} is standard/high-risk. Pausing for human 1-tap review.`);
            }
